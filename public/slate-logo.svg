<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>
  <g transform="translate(128, 128) scale(1.45) rotate(-15) translate(-128, -128)">
    <rect x="64" y="72" width="96" height="128" rx="24" fill="#064E3B" opacity="0.9" />
    <rect x="96" y="56" width="96" height="128" rx="24" fill="url(#emeraldGradient)" filter="url(#shadow)" />
    
    <!-- Subtle glassy highlight on the front slate -->
    <rect x="98" y="58" width="92" height="124" rx="22" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.3" />
  </g>
</svg>
