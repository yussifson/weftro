<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>No Internet Connection - CliPad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#10b981', // emerald-500
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <script>
    // Apply theme immediately to prevent flash
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="bg-[#f0f2f5] dark:bg-[#0A0F1C] text-slate-900 dark:text-slate-100 min-h-[100dvh] flex flex-col items-center justify-center p-6 font-sans antialiased transition-colors duration-300">

  <div class="flex flex-col items-center justify-center w-full max-w-sm text-center">
    
    <div class="w-20 h-20 bg-white dark:bg-[#1a2329] rounded-[24px] shadow-[0_8px_30px_rgba(0,0,0,0.08)] border border-slate-200 dark:border-white/5 flex items-center justify-center mb-8 relative">
       <!-- Pulse ring -->
       <div class="absolute inset-0 rounded-[24px] border border-primary/20 animate-ping"></div>
       <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
         <line x1="1" y1="1" x2="23" y2="23"></line>
         <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
         <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
         <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
         <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
         <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
         <line x1="12" y1="20" x2="12.01" y2="20"></line>
       </svg>
    </div>

    <h2 class="text-2xl font-black mb-3">No Internet Connection</h2>
    <p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-relaxed mb-10 px-4">
      It looks like you're offline. Please check your network connection and try again to access CliPad.
    </p>

    <button 
      onclick="window.location.href = 'https://clipad.optavel.com'" 
      class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/30 transition-transform active:scale-95 flex items-center justify-center gap-2"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
      Try Again
    </button>
  </div>

</body>
</html>
