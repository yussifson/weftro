openapi: 3.1.0
info:
  title: Weftro V3 Unified REST API Gateway
  description: >
    Production-grade, versioned REST API gateway exposing Weftro's organizational
    intelligence, memories, captures, entities, and smart moments to authorized applications.
  version: 1.0.0
servers:
  - url: https://wmabgiafwamxkcgxyhee.supabase.co/functions/v1/connect
    description: Production Supabase Edge Gateway

security:
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      summary: API Gateway Health Check
      description: Returns the health status and current API gateway version without exposing internal infrastructure details.
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/capabilities:
    get:
      summary: Discover Capabilities
      description: Lists the supported API version, authentication schemes, scopes, and active routes.
      security: []
      responses:
        '200':
          description: Supported capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /api/v1/apps:
    get:
      summary: List Developer Applications
      description: Lists registered applications belonging to the caller's organization.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of developer applications.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Register Developer Application
      description: Creates a new developer application, returning the client_id and a one-time unhashed client_secret.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Internal Analytics Dashboard"
                description:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Application successfully created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/apps/{id}:
    get:
      summary: Get Application Details
      description: Retrieves details of an existing application.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application record.
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update Application
      description: Updates application metadata, redirect URIs, or active status.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Updated application record.
    delete:
      summary: Delete Application
      description: Deletes an application and cascades to all its associated tokens.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application deleted.

  /api/v1/apps/{id}/rotate-secret:
    post:
      summary: Rotate Client Secret
      description: Generates a new client secret, invalidates the existing secret immediately, and returns the new secret once.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New client secret generated.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tokens:
    get:
      summary: List API Tokens
      description: Lists issued API tokens for the organization, optionally filtered by application.
      security:
        - BearerAuth: []
      parameters:
        - name: app_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of API tokens with granted scopes and metadata.
    post:
      summary: Issue API Access Token
      description: Issues a scoped personal or service API token (cpd_...) for an authorized application.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_id
              properties:
                app_id:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                  example: ["search:read", "memory:read", "context:read"]
                rate_limit_rpm:
                  type: integer
                  default: 120
                expires_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: API token issued with one-time plain access_token string.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tokens/{id}/revoke:
    post:
      summary: Revoke API Access Token
      description: Revokes an active token immediately.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token revoked.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks:
    get:
      summary: List Webhook Subscriptions
      description: Lists registered webhook endpoints for the authenticated organization.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of registered webhooks.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create Webhook Subscription
      description: Registers an outbound webhook subscription with SSRF validation. Returns endpoint details and one-time secret.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint_url
                - events
              properties:
                endpoint_url:
                  type: string
                  format: uri
                  example: "https://example.com/api/weftro-webhook"
                events:
                  type: array
                  items:
                    type: string
                  example: ["capture.created", "memory.created"]
                description:
                  type: string
                app_id:
                  type: string
      responses:
        '201':
          description: Webhook subscription created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/webhooks/{id}:
    get:
      summary: Get Webhook Subscription
      description: Retrieves details of a specific webhook subscription.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook details.
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update Webhook Subscription
      description: Updates URL, subscribed events, or active state.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint_url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Webhook updated.
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete Webhook Subscription
      description: Permanently deletes a webhook subscription.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/{id}/rotate-secret:
    post:
      summary: Rotate Webhook Signing Secret
      description: Generates a new signing secret and immediately invalidates the previous secret.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Secret rotated with new secret returned once.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/{id}/test:
    post:
      summary: Dispatch Test Webhook Event
      description: Sends a test ping with HMAC signature to verify receiver setup.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test ping dispatched and result returned.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/{id}/deliveries:
    get:
      summary: Get Webhook Delivery Logs
      description: Lists recent webhook delivery attempts, status codes, latency, and request IDs.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery attempts log.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/deliveries/{id}/retry:
    post:
      summary: Retry Webhook Delivery
      description: Re-dispatches a previously failed or recorded webhook delivery event using the subscription's current active secret.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique delivery event ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery retry dispatched successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/search:
    post:
      summary: Grounded Organizational Search
      description: Executes permission-aware search across organizational memories with full provenance and confidence scores.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Search term or concept
                  example: "Q3 architectural roadmap"
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
                offset:
                  type: integer
                  minimum: 0
                  default: 0
      responses:
        '200':
          description: Search results matching query with provenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/context/query:
    post:
      summary: Context Session Query
      description: Retrieves context session details and chronologically bound captures within the authorized organization.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
              properties:
                session_id:
                  type: string
                  format: uuid
                  example: "a0000000-0000-0000-0000-000000000001"
      responses:
        '200':
          description: Context session and associated captures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextQueryResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/memories:
    get:
      summary: List Memories
      description: Paginated retrieval of organizational memories filtered by tier and type.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: tier
          in: query
          schema:
            type: string
            enum: [personal, team, organizational]
        - name: type
          in: query
          schema:
            type: string
            enum: [FACT, DECISION, COMMITMENT, PREFERENCE, PROCESS, POLICY, PROJECT_CONTEXT, INSIGHT, SUMMARY]
      responses:
        '200':
          description: List of memories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
    post:
      summary: Create Organizational Memory
      description: Creates a verified, durable organizational memory node with confidence scores, provenance, and idempotency guarantees.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional idempotency key to prevent duplicate creation
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                content:
                  type: string
                summary:
                  type: string
                memory_type:
                  type: string
                  default: FACT
                memory_tier:
                  type: string
                  default: organizational
                confidence_score:
                  type: number
                  default: 1.0
                importance:
                  type: number
                  default: 0.5
                source_id:
                  type: string
                  format: uuid
                source_type:
                  type: string
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Memory successfully created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/memories/{id}:
    get:
      summary: Get Memory by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memory record details.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/entities/{id}:
    get:
      summary: Get Organizational Entity
      description: Retrieve normalized entity node and connected graph relationships.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entity node and relationships.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/captures:
    get:
      summary: List Captures
      description: Paginated list of recent captures.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of capture records.
    post:
      summary: Ingest Capture
      description: Ingests raw content, meeting transcripts, or text notes into the capture inbox and schedules asynchronous queue processing.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional idempotency key to prevent duplicate ingestion
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                title:
                  type: string
                content:
                  type: string
                source_type:
                  type: string
                  default: text_note
                capture_type:
                  type: string
                  default: NOTE
                context_session_id:
                  type: string
                  format: uuid
                metadata:
                  type: object
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Capture ingested and queued.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/captures/{id}:
    get:
      summary: Get Capture Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Capture record.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/captures/{id}/status:
    get:
      summary: Get Capture Processing & Queue Status
      description: Check the live processing status and durable queue attempt details for a capture.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Capture processing and queue state.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/smart-moments:
    get:
      summary: List Smart Moments
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of smart moments.

  /api/v1/sources/{id}:
    get:
      summary: Get Source Provenance
      description: Retrieve source record details (capture or video) backing an organizational memory or smart moment.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Source metadata.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: API Connect Token issued via Developer Application

  responses:
    BadRequest:
      description: Malformed or invalid request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, invalid, expired, or revoked API token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Insufficient scope or inactive application.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or belonging to another organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit bucket resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: "healthy"
            service:
              type: string
              example: "weftro-v3-api-gateway"
            version:
              type: string
              example: "v1"
        meta:
          type: object
          properties:
            request_id:
              type: string
            timestamp:
              type: string

    CapabilitiesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            api_version:
              type: string
            authentication:
              type: array
              items:
                type: string
            supported_scopes:
              type: array
              items:
                type: string
            endpoints:
              type: array
              items:
                type: object
            mcp:
              type: object
              properties:
                server_package:
                  type: string
                  example: "@weftro/mcp-server"
                supported_transport:
                  type: array
                  items:
                    type: string
                  example: ["stdio"]
                supported_tools:
                  type: array
                  items:
                    type: string

    SearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              content:
                type: string
              summary:
                type: string
              confidence:
                type: number
              provenance:
                type: object
        meta:
          type: object
          properties:
            request_id:
              type: string
            count:
              type: integer
            query:
              type: string

    ContextQueryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            session:
              type: object
            captures:
              type: array
              items:
                type: object
        meta:
          type: object

    MemoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              example: "INVALID_CREDENTIALS"
            message:
              type: string
              example: "The provided API token is invalid, unrecognized, or expired."
            request_id:
              type: string
              example: "req_a1b2c3d4e5f6"
