    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0B1418';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.backgroundColor = '#F8F9FA';
          }
        } catch (e) {}
      })();
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #F8F9FA; /* Executive warm ceramic/porcelain default */
      }
      html.dark, html.dark body {
        background-color: #0B1418;
      }
      body { top: 0px !important; }
      
      /* Pre-loader styles */
      .app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0B1418;
        z-index: 999999;
        color: #ffffff;
        overflow: hidden;
      }
      .app-preloader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 36px 44px;
        background: rgba(16, 29, 34, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .app-preloader-logo {
        height: 44px;
        width: auto;
        margin-bottom: 22px;
        object-fit: contain;
        animation: logoPulse 2.4s ease-in-out infinite;
      }
      .app-preloader-spinner {
        position: relative;
        width: 32px;
        height: 32px;
        margin-bottom: 16px;
      }
      .app-preloader-spinner::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2.5px solid rgba(12, 92, 60, 0.2);
      }
      .app-preloader-spinner::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #10B981;
        border-right-color: #0C5C3C;
        animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .app-preloader-text {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #94a3b8;
      }
      @keyframes logoPulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) {
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
